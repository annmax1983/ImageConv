const ALIASES = {
  'zh': 'zh-CN', 'zh-TW': 'zh-CN', 'zh-Hans': 'zh-CN',
  'es-ES': 'es', 'es-MX': 'es',
  'de-DE': 'de', 'de-AT': 'de',
  'fr-FR': 'fr', 'fr-CA': 'fr',
  'ja-JP': 'ja',
  'en-US': 'en', 'en-GB': 'en', 'en-AU': 'en'
};

function detectLang() {
  const raw = (navigator.language || 'en');
  const mapped = ALIASES[raw] || raw;
  if (I18N[mapped]) return mapped;
  const base = raw.split('-')[0];
  return I18N[base] ? base : 'en';
}

function apply(t) {
  document.title = t.title + ' - ImageConv';
  document.getElementById('title').textContent = t.title;
  document.getElementById('updated').textContent = t.updated;
  document.getElementById('highlight').innerHTML = t.highlight;
  document.getElementById('hWhat').textContent = t.hWhat;
  document.getElementById('pWhat').innerHTML = t.pWhat;
  document.getElementById('hCollect').textContent = t.hCollect;
  document.getElementById('pCollect').innerHTML = t.pCollect;
  document.getElementById('listCollect').innerHTML = t.listCollect.map(i => '<li>' + i + '</li>').join('');
  document.getElementById('hTransmit').textContent = t.hTransmit;
  document.getElementById('pTransmit').innerHTML = t.pTransmit;
  document.getElementById('hStore').textContent = t.hStore;
  document.getElementById('pStore').innerHTML = t.pStore;
  document.getElementById('listStore').innerHTML = t.listStore.map(i => '<li>' + i + '</li>').join('');
  document.getElementById('pStoreNote').innerHTML = t.pStoreNote;
  document.getElementById('hPerms').textContent = t.hPerms;
  document.getElementById('pPerms').innerHTML = t.pPerms;
  document.getElementById('listPerms').innerHTML = t.listPerms.map(i => '<li>' + i + '</li>').join('');
  document.getElementById('pHost').innerHTML = t.pHost;
  document.getElementById('hThird').textContent = t.hThird;
  document.getElementById('pThird').innerHTML = t.pThird;
  document.getElementById('hChildren').textContent = t.hChildren;
  document.getElementById('pChildren').innerHTML = t.pChildren;
  document.getElementById('hChanges').textContent = t.hChanges;
  document.getElementById('pChanges').innerHTML = t.pChanges;
  document.getElementById('hContact').textContent = t.hContact;
  document.getElementById('pContact').innerHTML = t.pContact;
  document.documentElement.lang = detectLang();
}

apply(I18N[detectLang()]);
